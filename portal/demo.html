<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Plus Portal Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#001641;--amber:#F0B323;--ink:#1A2238;--muted:#5F677A;--line:#DCDFE6;--panel:#F3F5F9;--ok:#2F6E4E;--bad:#A8392C;--tint:#FCEFD3;--tintx:#8A5800}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#fff;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:26px}header .t{font-weight:600;letter-spacing:.08em;font-size:12px;text-transform:uppercase;opacity:.85}
header .sp{flex:1}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.roles button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:5px 11px;font:500 12px Poppins;cursor:pointer}
.roles button.on{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 10px}
.who{background:var(--panel);border-radius:8px;padding:10px 14px;margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who b{color:var(--navy)}
.steps{display:flex;margin:14px 0 4px;overflow-x:auto}
.step{flex:1;min-width:110px;padding-top:10px;border-top:4px solid var(--line);font-size:12px;color:var(--muted);margin-right:4px}
.step.done{border-color:var(--navy);color:var(--ink)}.step.cur{border-color:var(--amber);color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:500 13px Poppins;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--navy);border-color:var(--amber)}
.n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.row>.grow{flex:1;min-width:200px}
.muted{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px;white-space:nowrap}
.p-done{background:var(--ok);color:#fff}.p-bad{background:var(--bad);color:#fff}.p-act{background:var(--tint);color:var(--tintx)}
.p-wait{border:1px solid var(--navy);color:var(--navy)}.p-idle{border:1px dashed #9aa1b1;color:var(--muted)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:500 13px Poppins;cursor:pointer}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn.red{background:var(--bad)}.btn.ok{background:var(--ok)}
.btn.sm{padding:5px 10px;font-size:12px}
input,select,textarea{font:13px Poppins;padding:8px;border:1px solid var(--line);border-radius:6px;width:100%}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-bottom:12px}.form .full{grid-column:1/-1}
.sw{width:64px;height:64px;border-radius:6px;flex:none}
.lock{background:#FBEAE8;color:var(--bad);border-left:4px solid var(--bad);padding:8px 10px;font-size:12px;font-weight:600;margin-top:8px;border-radius:4px}
.note{background:var(--panel);padding:8px 10px;border-radius:6px;font-size:12px;margin-top:8px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:4px}
.msg{max-width:78%;padding:8px 12px;border-radius:10px;background:var(--panel)}
.msg.me{align-self:flex-end;background:#E4EAF6}.msg .by{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px}.kpi b{font-size:24px;color:var(--navy);display:block}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:7px;text-align:left}th{color:var(--muted);font-weight:600}
.y{color:var(--ok);font-weight:700}.x{color:#b8bdc9}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none;max-width:90%;z-index:9}
.email{border:1px solid var(--line);border-radius:8px;margin-top:8px;font-size:12px}.email .h{background:var(--navy);color:#fff;padding:6px 10px;border-radius:8px 8px 0 0}.email .b{padding:8px 10px}
@media(max-width:600px){.form{grid-template-columns:1fr}.msg{max-width:92%}}
.hero{background:var(--navy);color:#fff;border-radius:8px;padding:22px;margin:12px 0}.hero h2{color:#fff;font-size:20px}.hero .muted{color:#C9D2E3}
.btn.big{padding:12px 22px;font-size:15px}.btn.amber{background:var(--amber);color:var(--navy)}
.photo{width:120px;height:80px;border-radius:6px;background:linear-gradient(135deg,#efe7da,#d9c9ad 60%,#efe7da);display:flex;align-items:flex-end;padding:4px;font-size:10px;color:#5b4a2b}
.esc{background:#FBEAE8;color:var(--bad);font-weight:600;font-size:12px;padding:4px 8px;border-radius:4px;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<header>
  <img src="assets/oplus-mark-white.png" alt="O-Plus">
  <span class="t">Client Portal · Live demo</span>
  <span class="sp"></span><span id="clock" class="t" style="font-size:13px;opacity:1;color:#F0B323"></span><span id="live" class="t" style="font-size:11px"></span>
  <div class="roles" id="roles"></div>
</header>
<div class="wrap">
  <div class="eyebrow" id="ucode"></div>
  <h1 id="uname"></h1>
  <div class="steps" id="steps"></div>
  <div class="who" id="who"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <p class="muted" style="margin-top:30px">Demo data only. <a href="#" id="reset">Reset demo (back to before payment)</a></p>
</div>
<div class="toast" id="toast"></div>
<script>
window.DEMO_API=''; // set to the Apps Script /exec URL of portal/demo-backend/Code.gs
const ROLES={
 client:{name:'Ahmed Hassan',title:'Client (unit owner)',tabs:['overview','req','design','site','mods','pay','chat','files']},
 board:{name:'Big screen',title:'Big screen',tabs:['board']},
 family:{name:'Mona Hassan',title:'Family (view only)',tabs:['overview','req','design','site','mods','pay','chat','files']},
 sales:{name:'Omar Nabil',title:'Sales',tabs:['overview']},
 head:{name:'Head of Projects',title:'Head of Projects',tabs:['board','overview','req','design','site','mods','pay','chat','files','reports','access']},
 design:{name:'Nour Samir',title:'Designer',tabs:['overview','req','design','chat','files']},
 pm:{name:'Eng. Karim Adel',title:'Project Manager',tabs:['board','overview','req','site','mods','pay','chat','files','reports']},
 site:{name:'Eng. Mahmoud (site)',title:'Site Engineer',tabs:['sitecam','mods']},
 cost:{name:'Hany Fawzy',title:'Cost',tabs:['req','mods','reports']},
 extra:{name:'Head of Extra Work',title:'Head of Extra Work',tabs:['mods','reports']},
 finance:{name:'Mai Ali',title:'Finance',tabs:['req','pay','reports']},
 time:{name:'Timekeeper',title:'Timekeeper',tabs:['clock','board']}
};
const TABN={board:'All cases',overview:'Overview',req:'Requests',design:'Design selections',site:'Site selections',mods:'Extra modifications',pay:'Payments',chat:'Chat',files:'Files',reports:'Reports',access:'Who sees what',sitecam:'Site Camera',clock:'Clock'};
const PEOPLE={
 c1:{name:'Hesham Adel',fn:'client',u:'u1'},c2:{name:'Tarek Nabil',fn:'client',u:'u2'},c3:{name:'Karim Fouad',fn:'client',u:'u3'},fam1:{name:'Mona Adel',fn:'family',u:'u1'},
 yara:{name:'Yara',fn:'sales'},ashiry:{name:'Ashiry',fn:'sales'},dina:{name:'Dina',fn:'sales'},
 amira:{name:'Amira',fn:'pm'},saad:{name:'Saad',fn:'pm'},abugabal:{name:'Omar Abu Gabal',fn:'pm'},omark:{name:'Omar Khaled',fn:'pm',mgr:1},
 nouran:{name:'Nouran',fn:'design'},ali:{name:'Ali',fn:'design'},maksoud:{name:'Abdelmaksoud',fn:'design',mgr:1},
 sharbagy:{name:'Sharbagy',fn:'cost'},alaa:{name:'Alaa',fn:'cost'},omar:{name:'Omar',fn:'cost',mgr:1},
 salma:{name:'Salma',fn:'finance'},ghandour:{name:'Ghandour',fn:'extra'},salah:{name:'Salah',fn:'head'},
 site:{name:'Site Engineer',fn:'site'},board:{name:'Big screen',fn:'board'},time:{name:'Timekeeper',fn:'time'}};
const UTEAM={u1:{sales:'yara',pm:'saad',design:'nouran',cost:'sharbagy'},u2:{sales:'ashiry',pm:'amira',design:'ali',cost:'sharbagy'},u3:{sales:'dina',pm:'abugabal',design:'ali',cost:'alaa'}};
const NEXT={yara:'fam1'};
const MGR={pm:'Omar Khaled (PM manager)',design:'Abdelmaksoud (Design manager)',cost:'Omar (Cost manager)',finance:'Salah (Head of Projects)'};
let me='c1';
const PN=id=>(PEOPLE[id]||{}).name||id;
function T(fn){if(fn=='finance')return 'Salma';const t=UTEAM[S&&S.u||'u1'];return t&&t[fn]?PN(t[fn]):fn}
const isMgr=()=>!!(PEOPLE[me]||{}).mgr;
function myUnits(){const P=PEOPLE[me]||{};if(P.u)return [P.u];if(['pm','design','cost','sales'].includes(P.fn)&&!P.mgr)return UNITS.filter(u=>UTEAM[u][P.fn]==me);return UNITS}
const STAGES=['Quotation paid','Kick-off','Design & selections','Execution','Snagging','Handover'];

const RT={q:{n:'I have a question',to:'pm',sla:'4 working hours'},chg:{n:'Change or add something',to:'design',sla:'1 working day'},pay:{n:'Payment or cheques',to:'finance',sla:'1 working day'},site:{n:'Problem on site / urgent',to:'pm',sla:'1 hour'}};
const SEED={paid:false,team:false,stage:-1,day:0,req:[],sel:[],mods:[],chat:[],files:[],log:[],
 pay:[{id:1,name:'Down payment',pct:'30%',due:'At contract',st:'Scheduled'},{id:2,name:'Installment 2 · Cheque',pct:'25%',due:'15 Dec 2026',st:'Scheduled'},{id:3,name:'Installment 3 · Cheque',pct:'25%',due:'15 Feb 2027',st:'Scheduled'},{id:4,name:'Final payment · at handover',pct:'20%',due:'Handover',st:'Scheduled'}]};
const SPD0=300/9,HPD=9,SLA={q:4,chg:9,pay:9,site:1};let CURH=0;
function dh(ts){if(!G||!G.clk)return 0;return G.clk.base+((ts||Date.now())-G.clk.ts)/1000/G.clk.spd}
function fmt(h){h=Math.max(0,h);const d=Math.floor(h/HPD)+1,m=Math.floor((h%HPD)*60),hh=9+Math.floor(m/60),mm=m%60;return 'Day '+d+' · '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
function dur(h){h=Math.max(0,h);if(h>=HPD){const d=Math.round(h/HPD*10)/10;return d+(d==1?' day':' days')}if(h>=1)return Math.round(h*10)/10+' h';return Math.max(1,Math.round(h*60))+' min'}
function alerts(){const now=dh(),out=[];if(!G.clk||!S.paid)return out;
 S.req.forEach(r=>{if(r.st=='Resolved')return;const age=now-r.h0,sla=SLA[r.type],late=age-sla,who=T(r.to);
  if(late>=2*HPD)out.push({k:r.id+'e2',to:[r.to,'pm'],mgrOf:r.to,head:1,lvl:'bad',m:r.id+' late by '+dur(late)+' · escalated to Salah',mail:{to:'Salah · Head of Projects',b:r.id+' “'+esc(r.t)+'” ('+S.client+') is late by '+dur(late)+'. Owner: '+who+'. Manager already alerted.'}});
  else if(late>=HPD)out.push({k:r.id+'e1',to:[r.to,'pm'],mgrOf:r.to,lvl:'bad',m:r.id+' late by '+dur(late)+' · escalated to '+MGR[r.to],mail:{to:MGR[r.to],b:r.id+' “'+esc(r.t)+'” ('+S.client+') is late by '+dur(late)+'. Owner: '+who+'.'}});
  else if(late>=0)out.push({k:r.id+'late',to:[r.to,'pm'],lvl:'bad',m:r.id+' is LATE (promise '+dur(sla)+') · owner '+who,mail:{to:who+' · ClickUp overdue',b:r.id+' “'+esc(r.t)+'” passed its reply time ('+dur(sla)+').'}});
  else if(age>=sla*0.75)out.push({k:r.id+'soon',to:[r.to],lvl:'warn',m:r.id+' reply due in '+dur(sla-age)})});
 S.sel.forEach(x=>{if(x.st!='Waiting')return;const age=now-x.h0;
  if(age>=2*HPD)out.push({k:x.id+'s2',to:['pm','design','head'],lvl:'bad',m:'Client has not decided “'+x.title+'” for '+dur(age)+'. Call the client'});
  else if(age>=HPD)out.push({k:x.id+'s1',to:['client','family'],lvl:'warn',m:'Reminder: “'+x.title+'” is waiting for your decision',mail:{to:S.client,b:'Reminder: “'+esc(x.title)+'” is waiting for your decision in the portal.'}})});
 S.mods.forEach(m=>{const age=now-(m.hs||m.h0);
  if(m.st=='Costing'&&age>=HPD)out.push({k:m.id+'c',to:['cost','extra'],mgrOf:'cost',lvl:'bad',m:m.id+' not costed after '+dur(age)+' (promise 1 day)'});
  if(m.st=='Awaiting client'&&age>=HPD)out.push({k:m.id+'a',to:['client','family'],lvl:'warn',m:'Reminder: addendum '+m.id+' is waiting for your approval',mail:{to:S.client,b:'Reminder: the addendum for '+m.id+' is waiting for your approval.'}})});
 S.pay.forEach(p=>{if(p.st!='Requested')return;const age=now-p.h0;
  if(age>=7*HPD)out.push({k:p.id+'p3',to:['pm','finance'],head:1,lvl:'bad',m:p.name+': no answer for 7 days. Call the client',mail:{to:'ClickUp @PM @Finance',b:'Client has not responded to '+p.name+' for 7 days. Please call the client.'}});
  else if(age>=5*HPD)out.push({k:p.id+'p2',to:['client','family'],lvl:'warn',m:'Second reminder: '+p.name+' is still pending',mail:{to:S.client,b:'Second reminder: '+p.name+' is still pending.'}});
  else if(age>=2*HPD)out.push({k:p.id+'p1',to:['client','family'],lvl:'warn',m:'Reminder: '+p.name+' is waiting for your confirmation',mail:{to:S.client,b:'Friendly reminder: '+p.name+' is waiting for your confirmation.'}})});
 return out}
const isMine=a=>a.to.includes(role)||(isMgr()&&a.mgrOf==role)||(role=='head'&&a.head);
function alertBox(){const a=alerts().filter(isMine);if(!a.length)return '';return a.map(x=>`<div class="${x.lvl=='bad'?'lock':'note'}" style="margin:0 0 8px;${x.lvl=='warn'?'background:#FCEFD3;color:#8A5800;font-weight:600':''}">${x.lvl=='bad'?'⛔ ':'⏰ '}${esc(x.m)}</div>`).join('')}
function mailsBox(){const ms=alerts().filter(a=>a.mail&&(isClientSide()?a.mail.to==S.client:a.mail.to!=S.client));if(!ms.length)return '';return '<div class="card"><h2>Emails sent automatically</h2>'+ms.map(a=>`<div class="email"><div class="h">To ${esc(a.mail.to)}</div><div class="b">${a.mail.b}</div></div>`).join('')+'</div>'}
const KEY='opdemo4';let S,role='client',tab='overview';
const $=s=>document.querySelector(s);
const UINFO={u1:{code:'OW/RV4-2TB · Whyt',client:'Hesham Adel',q:'Quotation 1505',scope:'Retractable pergola for parking + wood pergola for garden'},u2:{code:'OW/RV2-68-VA · Whyt',client:'Tarek Nabil',q:'Quotation 1423',scope:'Variation order works'},u3:{code:'OW/QV1-24C · Hillside Villas',client:'Karim Fouad',q:'Quotation 1815',scope:'Luxury finishing package'}};
// Cases 2 and 3 are already running when the show starts (history only, no typing needed).
function seedHistory(S){S.paid=true;S.team=true;S.stage=3;S.pay[0].st='Received';S.pay[1].st=S.u=='u2'?'Received':'Scheduled';
 S.files=[{n:'Signed quotation '+S.q+'.pdf',by:'Sales'},{n:'Approved design drawings.pdf',by:'Design'},{n:'Site photos week 45.zip',by:'Site'}];
 S.sel=[{id:'S0'+S.u,sec:'design',title:S.u=='u2'?'Wall paint colour':'Kitchen cabinets finish',opt:'Approved option A',color:'#e8e0d0',due:'done',st:'Approved',by:'Design',h0:-20}];
 S.req=[{id:'R-0'+(S.u=='u2'?'07':'11'),type:'q',t:'Can I visit the site on Friday?',to:'pm',st:'Resolved',h0:-30,h1:-29,ans:'Yes, Friday 11 AM with the site engineer.'}];
 S.log=[{t:'Case running · '+STAGES[3],who:'History'},{t:'Quotation paid · case opened',who:'History'}];return S}
// Scripted client requests on cases 2 and 3. They appear by themselves on the shared clock (demo hours after case 1 is paid).
const SCRIPT=[
 {k:'s1',h:1,u:'u3',rt:'q',rx:'When will the bathroom tiles arrive?',note:'nobody answers this one'},
 {k:'s2',h:3,u:'u2',rt:'q',rx:'Will the workers come on Saturday?',sg:'Yes, Saturday 9 AM to 4 PM. The site engineer will be there.'},
 {k:'s3',h:5,u:'u2',rt:'chg',rx:'I want a lighter marble for the entrance floor'},
 {k:'s4',h:7,u:'u3',rt:'chg',rx:'Please add a pergola on the roof terrace'}];
const fresh=u=>Object.assign(JSON.parse(JSON.stringify(SEED)),UINFO[u||'u1'],{u:u||'u1'});
const freshG=()=>({clk:null,sent:{},U:{u1:fresh('u1'),u2:seedHistory(fresh('u2')),u3:seedHistory(fresh('u3'))}});let G;
function eachUnit(f){const keep=S,out=[];myUnits().forEach(u=>{S=G.U[u];out.push(f(u))});S=keep;return out}
function load(){try{G=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!G||!G.U)G=freshG();S=G.U.u1;try{me=localStorage.getItem(KEY+'p')||'yara'}catch(e){}if(!PEOPLE[me])me='yara';role=PEOPLE[me].fn}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G));localStorage.setItem(KEY+'p',me)}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3500)}
function log(t){S.log.unshift({t,who:PN(me)})}
function mail(to,b){S.lastMail={to,b}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pill(st){const m={Approved:'p-done',Received:'p-done','Released to site':'p-done',Resolved:'p-done',Rejected:'p-bad',Overdue:'p-bad',Declined:'p-bad',Escalated:'p-bad',Waiting:'p-act',Open:'p-act',Requested:'p-act',Costing:'p-act','Awaiting client':'p-act','Client approved':'p-wait','Client confirmed':'p-wait',Scheduled:'p-idle'};return `<span class="pill ${m[st]||'p-wait'}">${st}</span>`}
const isClientSide=()=>role=='client'||role=='family';
const UNITS=['u1','u2','u3'];let unit='u1';
const curUnit=()=>{const m=myUnits();return m.includes(unit)?unit:m[0]};
const isTeam=()=>!isClientSide();
function ownerOnly(){if(role=='family'){toast('Only the unit owner can approve. Mona can follow, not approve.');return true}return false}
function n(){return S.req.length+S.mods.length+1}

function render(){
 S=G.U[curUnit()];save();$('#ucode').textContent='Unit '+S.code;$('#uname').textContent=S.client+"'s home";['ucode','uname','steps'].forEach(id=>$('#'+id).style.display=role=='board'?'none':'');const keep={},fid=document.activeElement&&document.activeElement.id;document.querySelectorAll('#main input,#main select').forEach(e=>{if(e.id&&e.type!='file'&&e.value!=='')keep[e.id]=e.value});
 $('#roles').innerHTML=Object.keys(PEOPLE).map(k=>`<button class="${k===me?'on':''}" data-r="${k}">${PN(k)}</button>`).join('');
 $('#steps').innerHTML=STAGES.map((s,i)=>`<div class="step ${i<S.stage?'done':i==S.stage?'cur':''}">${i<S.stage?'✓ ':''}${s}</div>`).join('');
 const R=ROLES[role];if(!R.tabs.includes(tab))tab=R.tabs[0];
 $('#who').innerHTML=`Playing <b>${PN(me)}</b> · ${R.title}${isMgr()?' (manager)':''}${isTeam()&&role!='board'&&role!='time'&&myUnits().length>1?' · Case: '+myUnits().map(u=>`<button class="btn sm ${u==unit?'':'ghost'}" data-unit="${u}">${G.U[u].client}</button>`).join(' '):''}`;
 if(!S.paid&&!['sales','board','time','head'].includes(role)&&!(role=='pm'&&isMgr())){$('#tabs').innerHTML='';$('#main').innerHTML=`<div class="hero"><h2>Case not open yet</h2><div class="muted">Waiting for the client to pay the quotation. Sales starts the case.</div></div>`;return}
 if(S.paid&&!S.team&&!['sales','head','client','family','board','time'].includes(role)){$('#tabs').innerHTML='';$('#main').innerHTML=`<div class="hero"><h2>Quotation paid · waiting for kick-off</h2><div class="muted">Head of Projects assigns the unit team. Then this case opens for you.</div></div>`;return}
 const mine=r=>r.st=='Open'&&(role=='pm'||role=='head'||r.to==role);
 const badge={req:isClientSide()?0:S.req.filter(mine).length,design:isClientSide()?S.sel.filter(x=>x.sec=='design'&&x.st=='Waiting').length:0,site:isClientSide()?S.sel.filter(x=>x.sec=='site'&&x.st=='Waiting').length:0,
  mods:S.mods.filter(m=>(role=='cost'&&m.st=='Costing')||(isClientSide()&&m.st=='Awaiting client')||(role=='extra'&&m.st=='Client approved')).length,
  pay:S.pay.filter(p=>(isClientSide()&&(p.st=='Requested'||p.st=='Overdue'))||(role=='finance'&&p.st=='Client confirmed')).length,
  sitecam:S.req.filter(r=>r.ask&&!r.photo).length};
 $('#tabs').innerHTML=R.tabs.map(t=>`<button class="${t==tab?'on':''}" data-t="${t}">${TABN[t]}${badge[t]?`<span class="n">${badge[t]}</span>`:''}</button>`).join('');
 $('#main').innerHTML=alertBox()+V[tab]()+(['overview','pay','clock','req'].includes(tab)?mailsBox():'');

 case 'release':mod().st='Released to site';log(i+' released to site');return 'Released · PM and Site Engineer can execute';
 case 'payask':pay().st='Requested';pay().remind=[];pay().h0=H;S.day=0;log('Payment requested: '+pay().name);mail(S.client,'O-Plus requests: '+pay().name+' ('+pay().pct+'), due '+pay().due+'. Please confirm in your portal.');return 'Client emailed · sees it in Payments';
 case 'payconf':pay().st='Client confirmed';log('Client confirmed '+pay().name);return 'Finance notified in ClickUp';
 case 'payrec':pay().st='Received';log('Received '+pay().name);mail(S.client,'We received '+pay().name+'. Thank you.');return 'Receipt emailed to client';
 case 'tick':{const p=S.pay.find(x=>x.st=='Requested'||x.st=='Overdue');if(!p)return;p.remind=p.remind||[];S.day=S.day<2?2:S.day<5?5:7;
  if(S.day==2){p.remind.push('Reminder 1 · day 2');mail(S.client,'Friendly reminder: '+p.name+' is waiting for your confirmation.')}
  else if(S.day==5){p.remind.push('Reminder 2 · day 5');mail(S.client,'Second reminder: '+p.name+' is still pending.')}
  else{if(p.st!='Overdue'){p.st='Overdue';p.remind.push('Escalated · day 7')}mail('ClickUp @Karim (PM) @Mai (Finance)','Client has not responded to '+p.name+' for 7 days. Please call the client.')}
  log('Auto: '+p.name+' day '+S.day);return S.day==7?'Escalated in ClickUp to PM and Finance':'Automatic reminder emailed to client'}
 case 'sla':S.req.filter(r=>r.st=='Open'&&!r.esc).forEach(r=>r.esc=1);log('Reply time missed · escalated to Head of Projects');return 'Escalated · @Head of Projects in ClickUp';
 case 'speed':if(G.clk)G.clk={base:dh(A.ts),ts:A.ts,spd:(+v.spd||5)*60/HPD};return 'Clock speed: 1 day = '+(+v.spd||5)+' minutes';
 case 'jump':if(G.clk)G.clk.base+=(+v.h||1);return 'Time moved forward '+dur(+v.h||1);
 case 'send':S.chat.push({by:nm,role:R,t:v.ct});return;
 case 'move':{const r=req();r.to=v.to;log(r.id+' reassigned to '+T(r.to));return 'Reassigned to '+T(r.to)+' · ClickUp task moved'}
 }}catch(e){console.warn('skip',A,e)}}

const API=(new URLSearchParams(location.search).get('api'))||window.DEMO_API||'';
const FIXED=new URLSearchParams(location.search).get('p');
let seen=0,busy=false,epoch=null;
function myCount(){const m=r=>r.st=='Open'&&(role=='pm'||role=='head'||r.to==role);let c=0;
 if(isClientSide())c+=S.sel.filter(x=>x.st=='Waiting').length+S.mods.filter(m=>m.st=='Awaiting client').length+S.pay.filter(p=>p.st=='Requested'||p.st=='Overdue').length+S.req.filter(r=>r.st=='Resolved').length;
 else c+=S.req.filter(m).length;
 if(role=='cost')c+=S.mods.filter(m=>m.st=='Costing').length;if(role=='extra')c+=S.mods.filter(m=>m.st=='Client approved').length;
 if(role=='finance')c+=S.pay.filter(p=>p.st=='Client confirmed').length;if(role=='site')c+=S.req.filter(r=>r.ask&&!r.photo).length+S.mods.filter(m=>m.st=='Released to site').length;
 if(role=='head')c+=(S.paid&&!S.team?1:0)+S.req.filter(r=>r.esc).length;
 return c+S.chat.length}
async function pull(mine){if(!API)return;if(busy&&!mine)return;busy=true;try{const r=await fetch(API+'?op=get&since='+seen,{cache:'no-store'});const j=await r.json();
 if(j.n<seen||(epoch!==null&&j.epoch!==epoch)){epoch=j.epoch;if(seen>0){G=freshG();S=G.U[curUnit()];seen=0;busy=false;return pull(mine)}}epoch=j.epoch;
 if(j.items&&j.items.length){const before=myCount();let last='',own='';j.items.forEach(x=>{const m=apply(x);if(x.id&&x.id===mine)own=m||'Done';else if(m)last=m});seen=j.n;const after=myCount();
  if(own)toast(own);else if(after>before&&!document.hidden){toast('🔔 '+(last||'New update'));try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}render()}
 $('#live').textContent='● Live';$('#live').style.color='#7BD69B'}catch(e){$('#live').textContent='● Reconnecting…';$('#live').style.color='#FF9A8A'}busy=false}
async function dispatch(A){A.ts=Date.now();A.u=A.u||curUnit();A.p=A.p||me;A.id=A.ts+'-'+Math.random().toString(36).slice(2,7);
 if(!API){const m=apply(A);if(m)toast(m);return render()}
 toast('Sending…');
 try{await fetch(API+'?op=add&d='+encodeURIComponent(JSON.stringify(A)),{cache:'no-store'});}catch(e){return toast('Not sent. Check the connection and try again')}
 while(busy)await new Promise(r=>setTimeout(r,100));await pull(A.id)}
document.addEventListener('click',e=>{
 if(e.target.id=='reset'){e.preventDefault();if(!confirmReset())return;return dispatch({a:'reset',r:role})}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.unit){unit=b.dataset.unit;if(tab=='board')tab=ROLES[role].tabs.find(t=>t!='board')||'board';return render()}
 if(b.dataset.next){me=b.dataset.next;role=PEOPLE[me].fn;tab=ROLES[role].tabs[0];fired.clear();first=true;return render()}
 if(b.dataset.r){if(FIXED)return;me=b.dataset.r;role=PEOPLE[me].fn;tab=ROLES[role].tabs[0];return render()}
 if(b.dataset.t){tab=b.dataset.t;return render()}
 const a=b.dataset.a;if(!a)return;
 if(role=='family'&&OWNER_ACTS.includes(a))return toast('Only the unit owner can approve or request. Family can follow, not act.');
 const v={};(NEED[a]||[]).forEach(k=>v[k]=($('#'+k)||{}).value||'');
 if(b.dataset.i){['ra','mn'].forEach(p=>{const el=$('#'+p+b.dataset.i);if(el)v[p+b.dataset.i]=el.value})}
 if(b.dataset.x){v.spd=b.dataset.x;v.h=b.dataset.x}
 if(a=='reqnew'&&!v.rx)return toast('Write your request first');
 if(a=='send'&&!v.ct)return;
 dispatch({a,r:role,i:b.dataset.i,s:b.dataset.s,v});
});
function confirmReset(){return S.log.length<1||window.confirm('Reset the demo for everyone?')}
document.addEventListener('change',e=>{if(e.target.dataset.move&&e.target.value)dispatch({a:'move',r:role,i:e.target.dataset.move,v:{to:e.target.value}})});
const fired=new Set();let first=true;
function feed(){const it=[];UNITS.forEach(u=>G.U[u].log.forEach(l=>{if(l.ts)it.push({...l,c:G.U[u].client})}));it.sort((a,b)=>b.ts-a.ts);
 return it.length?`<div class="card"><div class="eyebrow">Happening now</div>${it.slice(0,5).map((l,i)=>`<div style="padding:6px 0;${i?'':'font-weight:600;font-size:18px'}">${esc(l.c)} · ${esc(l.t)} <span class="muted">· ${esc(l.who)}</span></div>`).join('')}</div>`:''}
const pend=new Set();
function director(){if(role!='board'||!G.clk||!G.U.u1.paid)return;const now=dh();G.sent=G.sent||{};
 SCRIPT.forEach(x=>{if(now>=x.h&&!G.sent[x.k]&&!pend.has(x.k)){pend.add(x.k);dispatch({a:'reqnew',r:'client',u:x.u,k:x.k,p:x.u=='u2'?'c2':'c3',v:{rt:x.rt,rx:x.rx,sg:x.sg||''}})}})}
function tick(){director();$('#clock').textContent=G.clk?fmt(dh()):'';const us=myUnits();const all=[];us.forEach(u=>{const k=S;S=G.U[u];alerts().forEach(a=>{a.k=u+a.k;if(!isClientSide()&&us.length>1)a.m=S.client+': '+a.m;all.push(a)});S=k});const fresh_=all.filter(a=>isMine(a)&&!fired.has(a.k));fresh_.forEach(a=>fired.add(a.k));
 if(fresh_.length&&!first){toast((fresh_[0].lvl=='bad'?'⛔ ':'⏰ ')+fresh_[0].m);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
 if(fresh_.length||tab=='clock'||tab=='board'||Date.now()%10000<1000)render();first=false}
load();if(FIXED&&PEOPLE[FIXED]){me=FIXED;role=PEOPLE[me].fn;document.getElementById('roles').style.display='none'}if(API){G=freshG();S=G.U.u1;seen=0}render();setInterval(tick,1000);if(API){pull();setInterval(pull,2500)}
