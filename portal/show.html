<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Plus Portal · Live show</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#001641;--amber:#F0B323;--ink:#1A2238;--muted:#5F677A;--line:#DCDFE6;--panel:#F3F5F9;--ok:#2F6E4E;--bad:#A8392C;--tint:#FCEFD3;--tintx:#8A5800}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#F7F8FB;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header img{height:26px}header .t{font-weight:600;letter-spacing:.08em;font-size:12px;text-transform:uppercase;opacity:.85}
header .sp{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:22px;margin:4px 0 2px;color:var(--navy)}h2{font-size:16px;margin:0 0 8px;color:var(--navy)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.card.act{border-left:6px solid var(--amber)}.card.late{border-left:6px solid var(--bad)}
.muted{color:var(--muted);font-size:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:600 14px Poppins;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.red{background:var(--bad)}.btn.amber{background:var(--amber);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:7px 12px;font-size:13px}.btn.full{width:100%;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.acts .btn{flex:1 1 140px}
textarea,input,select{font:14px Poppins;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;margin-top:8px;background:#fff}
textarea{min-height:64px;resize:vertical}
.info{background:var(--panel);padding:10px 12px;border-radius:8px;margin-top:8px;font-size:13px;line-height:1.55}
.warn{background:#FBEAE8;color:var(--bad);font-weight:600;padding:8px 10px;border-radius:8px;margin-top:8px;font-size:13px}
.good{color:var(--ok);font-weight:600}
.fu{background:var(--tint);color:var(--tintx);font-weight:600;padding:8px 10px;border-radius:8px;margin-top:8px;font-size:13px}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:18px;margin:0 0 12px}.hero h2{color:#fff}.hero .muted{color:#C9D2E3}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.line{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.line:last-child{border:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px;white-space:nowrap;vertical-align:middle}
.p-bad{background:var(--bad);color:#fff}.p-ok{background:var(--ok);color:#fff}.p-act{background:var(--tint);color:var(--tintx)}.p-nv{background:#E4EAF6;color:var(--navy)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;max-width:92%;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.kpi b{font-size:28px;color:var(--navy);display:block}
.feed .l{padding:6px 0}.feed .l:first-child{font-weight:600;font-size:18px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 13px Poppins;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--amber)}
.n{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.thread{margin-top:10px;border-left:2px solid var(--line);padding-left:10px}
.msg{margin:0 0 8px}.msg .w{font-size:11px;color:var(--muted)}.msg .x{background:var(--panel);border-radius:8px;padding:7px 10px;display:inline-block;max-width:100%;font-size:13px}
.msg.cl .x{background:#FFF6DF}
.unit{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:6px}
.steps{display:flex;margin:10px 0 2px}.step{flex:1;padding-top:8px;border-top:4px solid rgba(255,255,255,.25);font-size:11px;color:#C9D2E3;margin-right:4px}
.step.done{border-color:#fff;color:#fff}.step.cur{border-color:var(--amber);color:#fff;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{height:74px;border-radius:8px;background:linear-gradient(135deg,#efe7da,#d9c9ad 60%,#efe7da);display:flex;align-items:flex-end;padding:5px;font-size:10px;color:#5b4a2b}
.doc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}.doc:last-child{border:0}
</style>
</head>
<body>
<header>
  <img src="assets/oplus-mark-white.png" alt="O-Plus">
  <span class="t">Client Portal</span>
  <span class="sp"></span><span id="clock" class="t" style="font-size:13px;opacity:1;color:#F0B323"></span><span id="live" class="t" style="font-size:11px"></span>
</header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
window.DEMO_API='https://script.google.com/macros/s/AKfycbxbzqm0Do6EaCJSBU5v4GEa546stTm7zT0BR33SKqS7Ua3hmwuIsXbDN9N5wTGGX0ph/exec';
// ---------- Cast ----------
const P={
 client:{n:'Client',d:'client',line:'You are the client of 3 homes'},
 ashiry:{n:'Ashiry',d:'sales',line:'Sales · client interface'},yara:{n:'Yara',d:'sales',line:'Sales · client interface'},dina:{n:'Dina',d:'sales',line:'Sales · client interface'},
 saad:{n:'Saad',d:'pm',line:'PM · site execution'},amira:{n:'Emeira',d:'pm',line:'PM · site execution'},abugabal:{n:'Omar Abu Gabal',d:'pm',line:'PM · site execution'},
 nouran:{n:'Nouran',d:'design',line:'Design · selections & drawings'},ali:{n:'Ali',d:'design',line:'Design · selections & drawings'},
 alaa:{n:'Alaa',d:'cost',line:'Cost · contractors & quotations'},sharbagy:{n:'Sharbagy',d:'cost',line:'Cost · contractors & quotations'},salma:{n:'Salma',d:'cost',line:'Cost · finance & cheques'},
 ghandour:{n:'Ghandour',d:'audit',aud:'sales',line:'Audit · Sales team · and every escalation before Salah'},omark:{n:'Omar Sheir',d:'audit',aud:'pm',line:'Audit · PMs team'},maksoud:{n:'Abdelmaksoud',d:'audit',aud:'design',line:'Audit · Design team'},omar:{n:'Omar Nada',d:'audit',aud:'cost',line:'Audit · Cost team'},
 salah:{n:'Salah',d:'top',line:'Top management · follow-up dashboard'},
 board:{n:'Big screen',d:'board',line:''}};
const AUDIT={sales:'ghandour',pm:'omark',design:'maksoud',cost:'omar'};
const DEPT={sales:'Sales',pm:'PM',design:'Design',cost:'Cost',audit:'Audit',top:'Top management'};
const TEAMLIST=['ashiry','yara','dina','saad','amira','abugabal','nouran','ali','alaa','sharbagy','salma','omark','maksoud','omar','ghandour','salah'];
const CASES={
 A:{c:'Hesham Adel',f:'Hesham',u:'OW/RV4-2TB · Whyt',scope:'Retractable pergola for parking + wood pergola for garden',q:'Quotation 1505',team:{sales:'ashiry',pm:'saad',design:'nouran',cost:'sharbagy'},stage:2},
 B:{c:'Tarek Nabil',f:'Tarek',u:'OW/RV2-68-VA · Whyt',scope:'Variation order works',q:'Quotation 1423',team:{sales:'yara',pm:'amira',design:'ali',cost:'sharbagy'},stage:2},
 C:{c:'Karim Fouad',f:'Karim',u:'OW/RV4-15A · Type G · Whyt',scope:'Finishing works',q:'Quotation 1815',team:{sales:'dina',pm:'abugabal',design:'ali',cost:'alaa'},stage:1}};
const STAGES=['Quotation paid','Design & selections','Execution','Snagging','Handover'];
const HPD=9,SLA=4;
// ---------- State: every action is replayed in order on every phone ----------
let G;const fresh=()=>({h:0,on:false,T:{},seq:0,log:[],U:{A:{chq:1},B:{chq:1},C:{chq:0}}});
const PN=id=>(P[id]||{}).n||id;
const tlist=()=>Object.values(G.T).sort((a,b)=>b.n-a.n);
function late(t){if(t.st!=='open'||!P[t.hold]||['audit','top'].includes(P[t.hold].d))return null;return G.h-(t.since+SLA)}
function lvl(t){const L=late(t);if(L===null||L<0)return 0;if(t.fu)return t.fu.l;const aud=AUDIT[P[t.hold].d];if(aud==='ghandour')return L>=HPD?3:1;return L>=2*HPD?3:L>=HPD?2:1}
function holder(l,t){return l==1?AUDIT[P[t.hold].d]:l==2?'ghandour':'salah'}
function add(t,w,a,x){t.hist.push({w,a,x:x||'',h:G.h})}
function feedLog(c,txt,ts){G.log.unshift({t:txt,c:c||'',ts})}
function apply(A){const me=A.p,t=A.i?G.T[A.i]:null,nm=PN(me),x=(A.x||'').trim();
 switch(A.a){
 case 'reset':G=fresh();return;
 case 'start':if(G.on)return;G.on=true;feedLog('','Portal live · 3 homes · team already assigned',A.ts);return 'Started';
 case 'jump':G.h+=(+A.h||1);feedLog('','Time moved forward '+dur(+A.h),A.ts);return;
 case 'new':{if(!x||!CASES[A.c])return;const id='T-'+(101+G.seq);const C=CASES[A.c];const tk={id,n:++G.seq,c:A.c,t:x,st:'open',hold:C.team.sales,since:G.h,ret:null,kind:null,hist:[],fu:null};add(tk,C.f,'asked',x);G.T[id]=tk;feedLog(A.c,C.f+' asked: “'+x+'” → '+PN(C.team.sales)+' (Sales)',A.ts);return 'Sent · '+PN(C.team.sales)+' (Sales) has it now'}
 case 'chq':G.U[A.c].chq=1;feedLog(A.c,'Salma: cheques secured ✓',A.ts);return 'Cheques marked secured';
 }
 if(!t)return;
 switch(A.a){
 case 'send':if(t.st!=='open'||t.hold!==me||!P[A.to])return;add(t,nm,'sent it to '+PN(A.to),x);t.hold=A.to;t.since=G.h;t.fu=null;feedLog(t.c,nm+' → '+PN(A.to)+(x?': “'+x+'”':''),A.ts);return 'Sent to '+PN(A.to);
 case 'reply':case 'opts':case 'quote':{if(t.st!=='open'||t.hold!==me||!x)return;const k={reply:'replied',opts:'sent options',quote:'sent a quotation'}[A.a];add(t,nm,k,x);t.st='client';t.kind=A.a;t.ret=me;t.hold='client';t.since=G.h;t.fu=null;feedLog(t.c,nm+' '+k+' to '+CASES[t.c].f+': “'+x+'”',A.ts);return 'Sent to the client'}
 case 'close':{if(t.st==='closed')return;if(me!=='client'&&t.hold!==me)return;const w=me==='client'?CASES[t.c].f:nm;add(t,w,'closed it ✓',x);t.st='closed';t.fu=null;feedLog(t.c,w+' closed '+t.id+' ✓',A.ts);return 'Closed ✓'}
 case 'ok':case 'no':case 'cr':{if(t.st!=='client')return;const f=CASES[t.c].f;if((A.a==='no'||A.a==='cr')&&!x)return;
  const k=A.a==='ok'?(t.kind==='quote'?'approved the quotation ✓':'approved ✓'):A.a==='no'?'rejected':'replied';add(t,f,k,x);t.st='open';t.hold=t.ret;t.since=G.h;t.kind=null;feedLog(t.c,f+' '+k+(x?': “'+x+'”':'')+' → back to '+PN(t.ret),A.ts);return 'Sent back to '+PN(t.ret)}
 case 'fu':if(t.st!=='open')return;t.fu={l:+A.l,by:me};add(t,nm,'followed up with '+PN(t.hold),'');feedLog(t.c,nm+' followed up with '+PN(t.hold),A.ts);return 'Follow-up sent to '+PN(t.hold);
 }}
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(h){const d=Math.floor(h/HPD)+1,m=Math.round((h%HPD)*60),hh=9+Math.floor(m/60);return 'Day '+d+' · '+String(hh).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dur(h){h=Math.abs(h);if(h>=HPD){const d=Math.round(h/HPD*10)/10;return d+(d==1?' day':' days')}return Math.round(h*10)/10+(h==1?' hour':' hours')}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
const me=(new URLSearchParams(location.search).get('p'))||'board';
const ME=P[me]||P.board;let tab=null;
const myCases=()=>Object.keys(CASES).filter(c=>Object.values(CASES[c].team).includes(me));
// ---------- Pieces ----------
function unitStrip(c){const u=G.U[c];return `<div class="unit"><span class="good">✓ Down payment received</span>${u.chq?'<span class="good">✓ Cheques secured</span>':'<span style="color:#A8392C;font-weight:600">⚠ Cheques NOT secured</span>'}${u.chq?'':'<span class="muted">Rule: no new work on site before the cheques are secured</span>'}</div>`}
function thread(t){return `<div class="thread">${t.hist.map(m=>`<div class="msg ${m.w===CASES[t.c].f?'cl':''}"><div class="w"><b>${esc(m.w)}</b> ${esc(m.a)} · ${fmt(m.h)}</div>${m.x?`<div class="x">${esc(m.x)}</div>`:''}</div>`).join('')}</div>`}
function status(t){if(t.st==='closed')return '<span class="pill p-ok">Closed ✓</span>';if(t.st==='client')return '<span class="pill p-nv">Waiting for the client</span>';const L=late(t);
 if(L===null)return `<span class="pill p-nv">With ${esc(PN(t.hold))}</span>`;return L>=0?`<span class="pill p-bad">${esc(PN(t.hold))} · LATE ${dur(L)}</span>`:`<span class="pill p-act">With ${esc(PN(t.hold))} · due in ${dur(-L)}</span>`}
function head(t){const C=CASES[t.c];return `<div class="eyebrow">${t.id} · ${esc(C.c)} · ${esc(C.u)}</div><b style="font-size:16px;display:block;margin:4px 0">“${esc(t.t)}”</b>${status(t)}`}
function teamActions(t){const C=CASES[t.c],tm=Object.values(C.team);
 const opts=TEAMLIST.filter(k=>k!==me).sort((a,b)=>(tm.includes(b)?1:0)-(tm.includes(a)?1:0)).map(k=>`<option value="${k}">${esc(PN(k))} · ${esc(DEPT[P[k].d])}${tm.includes(k)?' (this home)':''}</option>`).join('');
 const fu=t.fu?`<div class="fu">🔔 ${esc(PN(t.fu.by))} is following up on this. Please act now.</div>`:lvl(t)?`<div class="warn">⛔ Late · ${esc(PN(holder(lvl(t),t)))} has been alerted</div>`:'';
 return `${fu}<textarea id="x_${t.id}" placeholder="Write your reply, note, options or quotation…"></textarea>
 <div class="acts"><button class="btn ok" data-act="reply" data-i="${t.id}">Reply to client</button><button class="btn" data-act="opts" data-i="${t.id}">Send options to client</button>${P[me].d==='cost'?`<button class="btn" data-act="quote" data-i="${t.id}">Send quotation to client</button>`:''}</div>
 <div class="acts" style="align-items:center"><select id="to_${t.id}" style="flex:2 1 180px;margin:0"><option value="">Send to someone in the team…</option>${opts}</select><button class="btn ghost" data-act="send" data-i="${t.id}">Send</button><button class="btn ghost" data-act="close" data-i="${t.id}" style="flex:0 1 auto">Close ✓</button></div>`}
function clientActions(t){if(t.st!=='client')return '';const two=t.kind==='opts'||t.kind==='quote';
 return `<textarea id="x_${t.id}" placeholder="${two?'Your comment (needed to reject)':'Write back to your team'}"></textarea><div class="acts">${two?`<button class="btn ok" data-act="ok" data-i="${t.id}">Approve</button><button class="btn red" data-act="no" data-i="${t.id}">Reject with comment</button>`:`<button class="btn ok" data-act="close" data-i="${t.id}">All good · close ✓</button><button class="btn ghost" data-act="cr" data-i="${t.id}">Reply</button>`}</div>`}
function escCard(t,l){const L=late(t),au=PN(AUDIT[P[t.hold].d]);const ladder=l==1?'First escalation · your team':l==2?au+' (audit) did not act for 1 day':'Not solved by '+(au==='Ghandour'?'Ghandour':au+' or Ghandour');
 return `<div class="card late"><div class="eyebrow">${esc(CASES[t.c].c)} · ${t.id} · ${ladder}</div><b style="font-size:16px;display:block;margin-top:4px">⛔ ${esc(PN(t.hold))} (${esc(DEPT[P[t.hold].d])}) is late by ${dur(L)}</b><div class="info">“${esc(t.t)}”</div>${thread(t)}<button class="btn amber full" data-act="fu" data-i="${t.id}" data-l="${l}">Follow up with ${esc(PN(t.hold))}</button></div>`}
function myEsc(){return tlist().filter(t=>{const l=lvl(t);return l&&!t.fu&&holder(l,t)===me})}
function mine(){return tlist().filter(t=>t.st==='open'&&t.hold===me)}
function clientWaiting(c){return tlist().filter(t=>t.c===c&&t.st==='client')}
// ---------- Views ----------
function viewClient(){const cs=['A','B','C'];if(!tab||!CASES[tab])tab='A';const c=tab,C=CASES[c],ts=tlist().filter(t=>t.c===c);
 let h=`<div class="tabs">${cs.map(k=>{const n=clientWaiting(k).length;return `<button class="${k===c?'on':''}" data-tab="${k}">${esc(CASES[k].c)}${n?`<span class="n">${n}</span>`:''}</button>`}).join('')}</div>`;
 h+=`<div class="hero"><div class="muted">${esc(C.u)}</div><h2 style="font-size:22px;margin:2px 0">${esc(C.c)}'s home</h2><div class="muted">${esc(C.scope)} · ${esc(C.q)}</div><div class="steps">${STAGES.map((s,i)=>`<div class="step ${i<C.stage?'done':i==C.stage?'cur':''}">${i<C.stage?'✓ ':''}${s}</div>`).join('')}</div></div>`;
 const w=ts.filter(t=>t.st==='client');
 if(w.length)h+=`<div class="eyebrow" style="margin:4px 0 8px">Needs your answer · ${w.length}</div>`+w.map(t=>`<div class="card act">${head(t)}${thread(t)}${clientActions(t)}</div>`).join('');
 h+=`<div class="card"><h2>New request</h2><div class="muted">Ask anything: a question, a change, a new item, a payment. It reaches your team right away.</div><textarea id="nx_${c}" placeholder="Write your request…"></textarea><button class="btn full" data-new="${c}">Send to my team</button></div>`;
 const o=ts.filter(t=>t.st!=='client');
 h+=`<div class="card"><h2>My requests</h2>${o.length?o.map(t=>`<div class="line">${head(t)}${thread(t)}</div>`).join(''):'<div class="muted">No requests yet.</div>'}</div>`;
 h+=`<div class="card"><h2>Your team</h2><div class="unit">${Object.entries(C.team).map(([d,k])=>`<span><b>${esc(PN(k))}</b> · ${DEPT[d]}</span>`).join('')}</div></div>`;
 h+=`<div class="card"><h2>Payments</h2>${unitStrip(c)}</div>`;
 h+=`<div class="card"><h2>Site photos</h2><div class="tiles"><div class="tile">Week 45</div><div class="tile">Week 46</div><div class="tile">Today</div></div></div>`;
 h+=`<div class="card"><h2>Documents</h2>${['Signed '+C.q+'.pdf','Approved design drawings.pdf','Payment schedule.pdf'].map(d=>`<div class="doc"><span>📄 ${esc(d)}</span><span class="muted">Download</span></div>`).join('')}</div>`;
 return h}
function viewTeam(){const T=['mine','cases','activity'];if(ME.d==='audit')T.splice(1,0,'esc','team');if(!tab||!T.includes(tab))tab='mine';
 const m=mine(),e=myEsc();
 const lab={mine:'My tickets',esc:'Escalations',team:'My team',cases:'My homes',activity:'Activity'};const cnt={mine:m.length,esc:e.length};
 let h=`<div class="tabs">${T.map(k=>`<button class="${k===tab?'on':''}" data-tab="${k}">${lab[k]}${cnt[k]?`<span class="n">${cnt[k]}</span>`:''}</button>`).join('')}</div>`;
 if(!G.on)return h+`<div class="hero" style="text-align:center"><h2>Get ready 🎬</h2><div class="muted">The show starts at 3 PM. Keep this page open. Your phone buzzes when something needs you.</div></div>`;
 if(tab==='mine'){if(ME.d==='audit')h+=e.map(t=>escCard(t,lvl(t))).join('');
  h+=m.length?m.map(t=>`<div class="card ${late(t)>=0?'late':'act'}">${head(t)}${unitStrip(t.c)}${thread(t)}${teamActions(t)}</div>`).join(''):(ME.d==='audit'&&e.length?'':`<div class="hero" style="text-align:center"><h2>Nothing with you right now</h2><div class="muted">Keep this page open. Your phone buzzes the moment a ticket reaches you.</div></div>`);
  if(me==='salma')h+=`<div class="card"><h2>Cheques</h2>${Object.keys(CASES).map(c=>`<div class="doc"><span><b>${esc(CASES[c].c)}</b> · ${G.U[c].chq?'<span class="good">✓ secured</span>':'<span style="color:#A8392C;font-weight:600">⚠ not secured</span>'}</span>${G.U[c].chq?'':`<button class="btn sm ok" data-chq="${c}">Cheques secured</button>`}</div>`).join('')}</div>`}
 if(tab==='esc')h+=e.length?e.map(t=>escCard(t,lvl(t))).join(''):'<div class="muted">No escalations for you ✓</div>';
 if(tab==='team'){const ts=tlist().filter(t=>t.st==='open'&&P[t.hold]&&(P[t.hold].d===ME.aud||(me==='ghandour'&&lvl(t)>=2)));
  h+=`<div class="card"><h2>${esc(DEPT[ME.aud])} team · live</h2>${ts.length?ts.map(t=>`<div class="line">${head(t)}</div>`).join(''):'<div class="muted">Nothing open with your team ✓</div>'}</div>`}
 if(tab==='cases'){const cs=myCases().length?myCases():Object.keys(CASES);h+=cs.map(c=>caseCol(c)).join('')}
 if(tab==='activity')h+=feedCard(15)||'<div class="muted">Nothing yet.</div>';
 return h}
function caseCol(c){const C=CASES[c],ts=tlist().filter(t=>t.c===c);
 return `<div class="card"><div class="eyebrow">${esc(C.u)}</div><h2 style="margin:2px 0;font-size:19px">${esc(C.c)}</h2><div class="muted">Team: ${Object.entries(C.team).map(([d,k])=>esc(PN(k))+' ('+DEPT[d]+')').join(' · ')}</div>${unitStrip(c)}<div style="margin-top:8px">${ts.length?ts.map(t=>{const l=lvl(t);return `<div class="line"><b>${t.id}</b> “${esc(t.t)}”<br>${status(t)}${l?` → escalated to <b>${esc(PN(holder(l,t)))}</b>`:''}${t.fu?' · '+esc(PN(t.fu.by))+' following up':''}</div>`}).join(''):'<div class="muted">No tickets yet</div>'}</div></div>`}
function feedCard(n){return G.log.length?`<div class="card feed"><div class="eyebrow">Happening now</div>${G.log.slice(0,n).map(l=>`<div class="l">${l.c?esc(CASES[l.c].f)+' · ':''}${esc(l.t)}</div>`).join('')}</div>`:''}
function viewBoard(){const all=tlist(),n=[0,0,0,0];all.forEach(t=>n[lvl(t)]++);
 let h='';
 if(ME.d==='board')h+=`<div class="card"><div class="ctl">${G.on?'':'<button class="btn amber" data-start="1">▶ Start the show</button>'}<span class="muted">Move time:</span><button class="btn sm" data-jump="1">+1 hour</button><button class="btn sm" data-jump="4">+4 hours</button><button class="btn sm red" data-jump="9">+1 day</button><span style="flex:1"></span><a href="#" id="reset" class="muted">Reset</a></div></div>`;
 if(me==='salah'){const e=myEsc();h=`<h1>Salah</h1><div class="muted" style="margin-bottom:12px">${esc(ME.line)}</div>`+e.map(t=>escCard(t,3)).join('')+h}
 h+=`<div class="hero"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><div class="muted">${me==='salah'?'Follow-up dashboard':'O-Plus · all homes · live'}</div><h2 style="font-size:40px;margin:4px 0">${G.on?fmt(G.h):'Waiting to start'}</h2></div><div class="muted" style="max-width:430px">Reply promise: 4 working hours. Late → audit of the team (Ghandour · Omar Sheir · Abdelmaksoud · Omar Nada) → no action for 1 day → Ghandour → 1 more day → Salah</div></div></div>`;
 h+=`<div class="kpis"><div class="kpi"><span class="eyebrow">Open tickets</span><b>${all.filter(t=>t.st!=='closed').length}</b></div><div class="kpi"><span class="eyebrow">Closed</span><b>${all.filter(t=>t.st==='closed').length}</b></div><div class="kpi"><span class="eyebrow">With the audit</span><b>${n[1]}</b></div><div class="kpi"><span class="eyebrow">With Ghandour</span><b>${n[2]}</b></div><div class="kpi"><span class="eyebrow">With Salah</span><b style="color:${n[3]?'#A8392C':'#001641'}">${n[3]}</b></div></div>`;
 return h+feedCard(4)+`<div class="cols">${['A','B','C'].map(caseCol).join('')}</div>`}
function render(){const keep={},fid=document.activeElement&&document.activeElement.id;document.querySelectorAll('#app textarea,#app input,#app select').forEach(e=>{if(e.id)keep[e.id]=e.value});
 $('#clock').textContent=G.on?fmt(G.h):'';let h='';
 if(ME.d==='board'||me==='salah')h=viewBoard();
 else h=`<h1>${esc(ME.d==='client'?'Welcome back':ME.n)}</h1><div class="muted" style="margin-bottom:8px">${esc(ME.line)}</div>`+(ME.d==='client'?(G.on?viewClient():`<div class="hero" style="text-align:center"><h2>Get ready 🎬</h2><div class="muted">The show starts at 3 PM.</div></div>`):viewTeam());
 $('#app').innerHTML=h;Object.keys(keep).forEach(k=>{const e=document.getElementById(k);if(e&&keep[k]!=='')e.value=keep[k]});if(fid){const e=document.getElementById(fid);if(e){e.focus();try{const l=e.value.length;e.setSelectionRange&&e.setSelectionRange(l,l)}catch(x){}}}
 const ks=(ME.d==='client'?['A','B','C'].flatMap(c=>clientWaiting(c).map(t=>t.id+'_'+t.hist.length)):mine().map(t=>t.id+'_'+t.hist.length).concat(myEsc().map(t=>'E'+t.id+'_'+lvl(t))));
 const nw=ks.filter(k=>!seenK.has(k));ks.forEach(k=>seenK.add(k));
 if(nw.length&&loaded){toast(nw[0][0]==='E'?'🔔 Escalation: a ticket is late':'🔔 A ticket needs you');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
const seenK=new Set();let loaded=false;
// ---------- Sync ----------
const API=(new URLSearchParams(location.search).get('api'))||window.DEMO_API||'';
let seen=0,busy=false,epoch=null;
async function pull(mineId){if(!API)return;if(busy&&!mineId)return;busy=true;try{const r=await fetch(API+'?op=get&since='+seen,{cache:'no-store'});const j=await r.json();
 if(j.n<seen||(epoch!==null&&j.epoch!==epoch)){epoch=j.epoch;if(seen>0){G=fresh();seen=0;seenK.clear();loaded=false;busy=false;return pull(mineId)}}epoch=j.epoch;
 if(j.items&&j.items.length){let own='';j.items.forEach(x=>{if(x.show!==2&&x.a!=='reset')return;let m;try{m=apply(x)}catch(e){console.warn(e)}if(x.id&&x.id===mineId)own=m||'Done'});seen=j.n;if(own)toast(own);render()}
 if(!loaded){loaded=true;render()}$('#live').textContent='● Live';$('#live').style.color='#7BD69B'}catch(e){$('#live').textContent='● Reconnecting…';$('#live').style.color='#FF9A8A'}busy=false}
async function send(A){A.ts=Date.now();A.p=me;A.show=2;A.id=A.ts+'-'+Math.random().toString(36).slice(2,7);
 if(!API){const m=apply(A);if(m)toast(m);return render()}
 toast('Sending…');
 try{await fetch(API+'?op=add&d='+encodeURIComponent(JSON.stringify(A)),{cache:'no-store'})}catch(e){return toast('Not sent. Check the connection and try again')}
 while(busy)await new Promise(r=>setTimeout(r,100));await pull(A.id)}
document.addEventListener('click',e=>{
 if(e.target.id==='reset'){e.preventDefault();if(window.confirm('Reset the show for everyone?'))send({a:'reset'});return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;return render()}
 if(b.dataset.start)return send({a:'start'});
 if(b.dataset.jump)return send({a:'jump',h:+b.dataset.jump});
 if(b.dataset.chq)return send({a:'chq',c:b.dataset.chq});
 if(b.dataset.new){const el=document.getElementById('nx_'+b.dataset.new);if(!el.value.trim())return toast('Write your request first ✍️');const x=el.value;el.value='';return send({a:'new',c:b.dataset.new,x})}
 const a=b.dataset.act;if(!a)return;const i=b.dataset.i,el=document.getElementById('x_'+i),x=el?el.value.trim():'';
 if(a==='fu')return send({a,i,l:+b.dataset.l});
 if(['reply','opts','quote','no','cr'].includes(a)&&!x)return toast(a==='no'?'Write your comment first ✍️':'Write it first ✍️');
 if(a==='send'){const to=document.getElementById('to_'+i).value;if(!to)return toast('Choose who to send it to');if(el)el.value='';return send({a,i,to,x})}
 if(el)el.value='';send({a,i,x});
});
G=fresh();render();if(API){pull();setInterval(pull,2500)}
</script>
