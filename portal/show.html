<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Plus Portal · Live show</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#001641;--amber:#F0B323;--ink:#1A2238;--muted:#5F677A;--line:#DCDFE6;--panel:#F3F5F9;--ok:#2F6E4E;--bad:#A8392C;--tint:#FCEFD3;--tintx:#8A5800}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#F7F8FB;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header img{height:26px}header .t{font-weight:600;letter-spacing:.08em;font-size:12px;text-transform:uppercase;opacity:.85}
header .sp{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:22px;margin:4px 0 2px;color:var(--navy)}h2{font-size:16px;margin:0 0 8px;color:var(--navy)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.card.act{border-left:6px solid var(--amber)}.card.late{border-left:6px solid var(--bad)}
.muted{color:var(--muted);font-size:12px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:600 14px Poppins;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.red{background:var(--bad)}.btn.amber{background:var(--amber);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:7px 12px;font-size:13px}.btn.full{width:100%;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.acts .btn{flex:1 1 140px}
textarea,input,select{font:14px Poppins;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;margin-top:8px;background:#fff}
textarea{min-height:64px;resize:vertical}
.info{background:var(--panel);padding:10px 12px;border-radius:8px;margin-top:8px;font-size:13px;line-height:1.55}
.warn{background:#FBEAE8;color:var(--bad);font-weight:600;padding:8px 10px;border-radius:8px;margin-top:8px;font-size:13px}
.good{color:var(--ok);font-weight:600}
.fu{background:var(--tint);color:var(--tintx);font-weight:600;padding:8px 10px;border-radius:8px;margin-top:8px;font-size:13px}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:18px;margin:0 0 12px}.hero h2{color:#fff}.hero .muted{color:#C9D2E3}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.line{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.line:last-child{border:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px;white-space:nowrap;vertical-align:middle}
.p-bad{background:var(--bad);color:#fff}.p-ok{background:var(--ok);color:#fff}.p-act{background:var(--tint);color:var(--tintx)}.p-nv{background:#E4EAF6;color:var(--navy)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;max-width:92%;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.kpi b{font-size:28px;color:var(--navy);display:block}
.feed .l{padding:6px 0}.feed .l:first-child{font-weight:600;font-size:18px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 13px Poppins;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--amber)}
.n{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.thread{margin-top:10px;border-left:2px solid var(--line);padding-left:10px}
.msg{margin:0 0 8px}.msg .w{font-size:11px;color:var(--muted)}.msg .x{background:var(--panel);border-radius:8px;padding:7px 10px;display:inline-block;max-width:100%;font-size:13px}
.msg.cl .x{background:#FFF6DF}
.unit{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:6px}
.steps{display:flex;margin:10px 0 2px}.step{flex:1;padding-top:8px;border-top:4px solid rgba(255,255,255,.25);font-size:11px;color:#C9D2E3;margin-right:4px}
.step.done{border-color:#fff;color:#fff}.step.cur{border-color:var(--amber);color:#fff;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{height:74px;border-radius:8px;background:linear-gradient(135deg,#efe7da,#d9c9ad 60%,#efe7da);display:flex;align-items:flex-end;padding:5px;font-size:10px;color:#5b4a2b}
.doc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}.doc:last-child{border:0}
</style>
<style>
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.k div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.k b{display:block;font-size:20px;color:var(--navy)}.k .r b{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}.row:last-child{border:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}
.sel{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.sel:last-child{border:0}.sw{width:42px;height:42px;border-radius:8px;flex:none;border:1px solid var(--line)}
.chat .m{max-width:84%;padding:7px 10px;border-radius:10px;background:var(--panel);margin:6px 0}.chat .me{margin-left:auto;background:#E4EAF6}.chat .w2{font-size:10px;color:var(--muted)}
.voice{display:flex;align-items:center;gap:6px;min-width:150px}.voice i{flex:1;height:14px;background:repeating-linear-gradient(90deg,#9aa6c4 0 2px,transparent 2px 5px);border-radius:3px}
.conv{border:1px dashed var(--amber);background:#FFFBEF;border-radius:8px;padding:5px 8px;font-size:11px;font-weight:600;color:#8A5800;margin-top:4px;display:inline-block}
.trk{margin-top:8px}.trk div{font-size:12px;padding:3px 0 3px 16px;position:relative}.trk div:before{content:'';position:absolute;left:3px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ok)}.trk div.now:before{background:var(--amber)}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:5px;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--amber);border-radius:5px}
.grp{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}.grp>.row{padding:10px 12px}.grp .in{padding:0 12px 8px}
.btn.gh{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.why{font-size:11px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<header>
  <img src="assets/oplus-mark-white.png" alt="O-Plus">
  <span class="t">Client Portal</span>
  <span class="sp"></span><span id="clock" class="t" style="font-size:13px;opacity:1;color:#F0B323"></span><span id="live" class="t" style="font-size:11px"></span>
</header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
window.DEMO_API='https://script.google.com/macros/s/AKfycbxbzqm0Do6EaCJSBU5v4GEa546stTm7zT0BR33SKqS7Ua3hmwuIsXbDN9N5wTGGX0ph/exec';
// ================= Cast (each person plays one real role) =================
const P={
 c1:{n:'Hesham Adel',d:'client',c:'A'},c2:{n:'Tarek Nabil',d:'client',c:'B'},c3:{n:'Karim Fouad',d:'client',c:'C'},
 ashiry:{n:'Ashiry',d:'sales'},yara:{n:'Yara',d:'sales'},dina:{n:'Dina',d:'sales'},
 saad:{n:'Saad',d:'pm'},amira:{n:'Emeira',d:'pm'},abugabal:{n:'Omar Abu Gabal',d:'pm'},
 nouran:{n:'Nouran',d:'design'},ali:{n:'Ali',d:'design'},
 sharbagy:{n:'Sharbagy',d:'cost'},alaa:{n:'Alaa',d:'cost'},salma:{n:'Salma',d:'cost',fin:1},
 ghandour:{n:'Ghandour',d:'audit',aud:'sales'},omark:{n:'Omar Sheir',d:'audit',aud:'pm'},maksoud:{n:'Abdelmaksoud',d:'audit',aud:'design'},omar:{n:'Omar Nada',d:'audit',aud:'cost'},
 salah:{n:'Salah',d:'top'},board:{n:'Big screen',d:'board'}};
const AUDIT={sales:'ghandour',pm:'omark',design:'maksoud',cost:'omar'};
const DEPT={sales:'Sales',pm:'PM',design:'Design',cost:'Cost',audit:'Audit',top:'Top management',client:'Client'};
const TEAMS=[['sales','Sales',['ashiry','yara','dina']],['pm','PMs',['saad','amira','abugabal']],['design','Design',['nouran','ali']],['cost','Cost',['sharbagy','alaa','salma']]];
const ROLE={sales:'Sales · company representative to the client',pm:'PM · site execution',design:'Design · selections & drawings',cost:'Cost · quotations & contractor payments',audit:'Audit',top:'Top management'};
const CASES={
 A:{c:'Hesham Adel',f:'Hesham',u:'OW/RV4-2TB · Whyt',scope:'Retractable pergola for parking + wood pergola for garden',q:'Quotation 1505',team:{sales:'ashiry',pm:'saad',design:'nouran',cost:'sharbagy'},stage:2,pct:58,next:'Pergola installation · Sun 23 Nov'},
 B:{c:'Tarek Nabil',f:'Tarek',u:'OW/RV2-68-VA · Whyt',scope:'Variation order works',q:'Quotation 1423',team:{sales:'yara',pm:'amira',design:'ali',cost:'sharbagy'},stage:2,pct:41,next:'Entrance flooring · Tue 25 Nov'},
 C:{c:'Karim Fouad',f:'Karim',u:'OW/RV4-15A · Type G · Whyt',scope:'Finishing works',q:'Quotation 1815',team:{sales:'dina',pm:'abugabal',design:'ali',cost:'alaa'},stage:1,pct:22,next:'Final selections · Thu 20 Nov'}};
const STAGES=['Quotation paid','Design & selections','Execution','Snagging','Handover'];
const SEEDSEL={A:[['Garden pergola wood','Teak, oil finish','#a0764e'],['Pergola roof fabric','Sand beige · v2','#e9e4da'],['Frame colour','Anthracite RAL 7016','#5d5f63']],B:[['Wall paint','Off-white RAL 9001','#f1ece1'],['Kitchen worktop','Quartz grey','#b9bcbf']],C:[['Kitchen cabinets','Walnut veneer','#6b4a32']]};
const SUG={A:['Can I see the colour options for the parking pergola?','When will the workers start the parking pergola?','I would like lighting under the garden pergola. Can you price it?','When is my next installment due?'],
 B:['I would like a lighter marble for the entrance floor','Will the workers come on Saturday?','Can you send me the latest drawings?','I want to change the kitchen worktop colour'],
 C:['I want to add a glass house on the roof. Can you price it?','Please send me the tile selection for the bathrooms','When will the finishing works start?','Which cheques do I still need to hand over?']};
const DUMMY=['Mona Saleh · RV3-11B','Ahmed Fathy · RV1-04A','Laila Samy · RV5-21C','Hany Aziz · RV2-07D','Nada Kamal · RV6-30A','Sherif Lotfy · RV4-09B','Rana Youssef · RV1-18C','Tamer Said · RV7-02A','Dalia Nour · RV3-25D'];
const HPD=9,SLA=4;
// ================= State: all phones replay the same list of actions =================
let G;
const fresh=()=>({h:0,on:false,T:{},seq:0,log:[],U:{A:{chq:1},B:{chq:1},C:{chq:0}},chat:{A:[],B:[],C:[]},sel:{A:[],B:[],C:[]},mseq:0});
const PN=id=>(P[id]||{}).n||id;
const dep=id=>(P[id]||{}).d;
const tlist=()=>Object.values(G.T).sort((a,b)=>b.n-a.n);
const resp=t=>t.st==='client'?t.ret:t.hold; // the team member responsible right now
function late(t){if(t.st!=='open'||!['sales','pm','design','cost'].includes(dep(t.hold)))return null;return G.h-(t.since+SLA)}
// escalation level: 1 audit · 2 Ghandour · 3 Salah. Triggered by time OR by the client pressing Escalate.
function lvl(t){if(t.st==='done')return 0;if(t.fu)return 0;let l=0;const r=resp(t),aud=AUDIT[dep(r)];if(!aud)return 0;
 const L=late(t);if(L!==null&&L>=0)l=aud==='ghandour'?(L>=HPD?3:1):(L>=2*HPD?3:L>=HPD?2:1);
 if(t.esc){const a=G.h-t.esc.h;const e=aud==='ghandour'?(a>=HPD?3:1):(a>=2*HPD?3:a>=HPD?2:1);l=Math.max(l,e)}
 return l}
function holder(l,t){return l==1?AUDIT[dep(resp(t))]:l==2?'ghandour':'salah'}
function tr(t,x){t.cl.push({x,h:G.h})} // client tracking line
function H(t,w,a,x){t.hist.push({w,a,x:x||'',h:G.h})}
function feed(c,txt,ts){G.log.unshift({t:txt,c:c||'',ts})}
const who=k=>PN(k)+' ('+DEPT[dep(k)]+')';
function target(t,k){const C=CASES[t.c];return k==='fin'?'salma':C.team[k]}
function apply(A){const me=A.p,nm=PN(me),x=(A.x||'').trim(),t=A.i?G.T[A.i]:null;
 switch(A.a){
 case 'reset':G=fresh();return;
 case 'start':if(G.on)return;G.on=true;feed('','Portal live · 3 homes · team already assigned',A.ts);return 'Started';
 case 'jump':G.h+=(+A.h||1);feed('','Time moved forward '+dur(+A.h),A.ts);return;
 case 'new':{const c=A.c,C=CASES[c];if(!x||!C)return;const id='REQ-'+(1041+G.seq);const s=C.team.sales;
  const tk={id,n:++G.seq,c,t:x,st:'open',hold:s,stack:[],since:G.h,ret:null,kind:null,hist:[],cl:[],fu:null,esc:null};H(tk,C.f,'asked',x);tr(tk,'Received by '+who(s)+' · reply within 4 working hours');G.T[id]=tk;feed(c,C.f+' asked: “'+x+'” → '+PN(s)+' (Sales)',A.ts);return 'Sent · '+PN(s)+' (Sales) has it'}
 case 'msg':{const c=A.c;if(!x&&!A.v)return;G.chat[c].push({id:++G.mseq,w:me,x:A.v?'Voice note':x,v:A.v?1:0,h:G.h});feed(c,(dep(me)==='client'?CASES[c].f:nm)+' in chat: '+(A.v?'🎤 voice note':'“'+x+'”'),A.ts);return}
 case 'conv':{const c=A.c,m=G.chat[c].find(z=>z.id==A.m);if(!m||m.conv)return;m.conv=1;const s={id:'S'+(++G.mseq),title:x||'Selection',opt:m.x,st:'Waiting',by:me,from:'chat',h:G.h};G.sel[c].push(s);feed(c,nm+' converted a chat message into a selection: '+s.title,A.ts);return 'Sent to the client as a selection'}
 case 'selok':case 'selno':{const c=A.c,s=G.sel[c].find(z=>z.id===A.s);if(!s||s.st!=='Waiting')return;if(A.a==='selno'&&!x)return;s.st=A.a==='selok'?'Approved':'Rejected';s.cm=x;feed(c,CASES[c].f+(A.a==='selok'?' approved selection “'+s.title+'” ✓':' rejected “'+s.title+'”: “'+x+'”'),A.ts);if(A.a==='selno')G.chat[c].push({id:++G.mseq,w:me,x:'Rejected “'+s.title+'”: '+x,h:G.h});return A.a==='selok'?'Approved ✓ · saved in your selections':'Sent back with your comment'}
 }
 if(!t)return;const C=CASES[t.c];
 switch(A.a){
 case 'asg':{if(t.st!=='open'||t.hold!==me)return;const to=target(t,A.k);if(!to||to===me)return;const lab={pm:'Assigned to',design:A.k2==='draw'?'Asked for a drawing from':'Assigned to',cost:A.k2==='price'?'Asked for a price from':'Assigned to',fin:'Asked about cheques from'}[A.k]||'Assigned to';
  t.stack.push(me);H(t,nm,lab.toLowerCase()+' '+PN(to),x);t.hold=to;t.since=G.h;t.fu=null;
  tr(t,(A.k2==='site'?'Approved · sent to '+who(to)+' for site execution':lab+' '+who(to)+' · working on it'));feed(t.c,nm+' → '+PN(to)+(x?': “'+x+'”':''),A.ts);return 'Sent to '+PN(to)+' · the client sees the update'}
 case 'back':{if(t.st!=='open'||t.hold!==me||!t.stack.length)return;const to=t.stack.pop();H(t,nm,'answered '+PN(to),x||A.dx||'');t.hold=to;t.since=G.h;t.fu=null;tr(t,PN(me)+' finished their part · back with '+who(to));feed(t.c,nm+' answered '+PN(to)+': “'+(x||A.dx)+'”',A.ts);return 'Sent back to '+PN(to)}
 case 'chq':{if(t.hold!==me)return;G.U[t.c].chq=1;H(t,nm,'confirmed the cheques are secured',x);tr(t,'Payments checked by '+who(me)+' ✓');feed(t.c,'Salma: '+C.f+'’s cheques secured ✓',A.ts);
  if(t.stack.length){const to=t.stack.pop();t.hold=to;t.since=G.h;t.fu=null}return 'Cheques marked secured'}
 case 'reply':{if(t.st!=='open'||t.hold!==me||!x)return;H(t,nm,'replied to '+C.f,x);t.st='done';t.fu=null;if(t.esc)t.esc.done=1;tr(t,'Answered by '+who(me)+' ✓ “'+x+'”');feed(t.c,nm+' replied to '+C.f+': “'+x+'” ✓',A.ts);return 'Reply sent · request resolved'}
 case 'opts':case 'quote':{if(t.st!=='open'||t.hold!==me||!x)return;H(t,nm,A.a==='opts'?'sent options':'sent a quotation',x);t.st='client';t.kind=A.a;t.ret=me;t.since=G.h;t.fu=null;tr(t,(A.a==='opts'?'Options':'Quotation')+' ready for your approval · from '+who(me));feed(t.c,nm+' sent '+(A.a==='opts'?'options':'a quotation')+' to '+C.f+': “'+x+'”',A.ts);return 'Sent to the client for approval'}
 case 'ok':case 'no':{if(t.st!=='client')return;if(A.a==='no'&&!x)return;const k=A.a==='ok'?(t.kind==='quote'?'approved the quotation ✓':'approved ✓'):'rejected';H(t,C.f,k,x);
  if(A.a==='ok'&&t.kind==='opts')G.sel[t.c].push({id:'S'+(++G.mseq),title:t.t,opt:t.hist.filter(z=>z.a==='sent options').pop().x,st:'Approved',by:t.ret,from:'req',h:G.h});
  t.st='open';t.hold=t.ret;t.since=G.h;t.kind=null;tr(t,'You '+k+(x?': “'+x+'”':'')+' · back with '+who(t.ret));feed(t.c,C.f+' '+k+(x?': “'+x+'”':''),A.ts);return 'Sent · '+PN(t.ret)+' is notified'}
 case 'esc':{if(t.st==='done'||!x)return;const r=resp(t),aud=AUDIT[dep(r)];t.esc={x,h:G.h};t.fu=null;H(t,C.f,'escalated',x);tr(t,'Escalated to '+PN(aud)+' ('+DEPT[dep(r)]+' audit) · they will follow up');feed(t.c,'⚠ '+C.f+' escalated '+t.id+': “'+x+'” → '+PN(aud),A.ts);return 'Escalated to '+PN(aud)}
 case 'fu':{if(t.st==='done')return;const r=resp(t);t.fu={by:me,h:G.h};if(t.esc)t.esc.done=1;H(t,nm,'followed up with '+PN(r),x);tr(t,PN(me)+' is following up with '+PN(r));feed(t.c,nm+' followed up with '+PN(r),A.ts);return 'Follow-up sent to '+PN(r)}
 }}
// ================= helpers =================
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(h){const d=Math.floor(h/HPD)+1,m=Math.round((h%HPD)*60),hh=9+Math.floor(m/60);return 'Day '+d+' · '+String(hh).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dur(h){h=Math.abs(h);if(h>=HPD){const d=Math.round(h/HPD*10)/10;return d+(d==1?' day':' days')}if(h<1)return Math.max(1,Math.round(h*60))+' min';return Math.round(h*10)/10+(h==1?' hour':' hours')}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
const me=(new URLSearchParams(location.search).get('p'))||'board';
const ME=P[me]||P.board;let tab=null,open=null,showInfo=false;
const homesOf=k=>Object.keys(CASES).filter(c=>k==='salma'||Object.values(CASES[c].team).includes(k));
const chatWaits=c=>{const m=G.chat[c];return m.length&&dep(m[m.length-1].w)==='client'};
function needsMe(c){return tlist().some(t=>t.c===c&&t.st==='open'&&t.hold===me)||(chatWaits(c)&&[CASES[c].team.sales,CASES[c].team.design].includes(me))}
function status(t){if(t.st==='done')return '<span class="pill p-ok">Resolved ✓</span>';if(t.st==='client')return '<span class="pill p-nv">Waiting for the client</span>';const L=late(t);

function viewBoard(){const all=tlist(),n=[0,0,0,0];all.forEach(t=>n[lvl(t)]++);
 return `<div class="card"><div class="ctl">${G.on?'':'<button class="btn amber" data-start="1">▶ Start the show</button>'}<span class="muted">Move time:</span><button class="btn sm" data-jump="1">+1 hour</button><button class="btn sm" data-jump="4">+4 hours</button><button class="btn sm red" data-jump="9">+1 day</button><span style="flex:1"></span><a href="#" id="reset" class="muted">Reset</a></div></div>
 <div class="hero"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><div class="muted">O-Plus · all homes · live</div><h2 style="font-size:40px;margin:4px 0">${G.on?fmt(G.h):'Waiting to start'}</h2></div><div class="muted" style="max-width:430px">Reply promise: 4 working hours. Late or client escalation → audit of the team → no action for 1 day → Ghandour → 1 more day → Salah</div></div></div>
 <div class="kpis"><div class="kpi"><span class="eyebrow">Open requests</span><b>${all.filter(t=>t.st!=='done').length}</b></div><div class="kpi"><span class="eyebrow">Resolved</span><b>${all.filter(t=>t.st==='done').length}</b></div><div class="kpi"><span class="eyebrow">With the audit</span><b>${n[1]}</b></div><div class="kpi"><span class="eyebrow">With Ghandour</span><b>${n[2]}</b></div><div class="kpi"><span class="eyebrow">With Salah</span><b style="color:${n[3]?'#A8392C':'#001641'}">${n[3]}</b></div></div>`+feedCard(4)+`<div class="cols">${['A','B','C'].map(caseCol).join('')}</div>`}
// ================= render =================
function render(){const keep={},fid=document.activeElement&&document.activeElement.id;document.querySelectorAll('#app textarea,#app input').forEach(e=>{if(e.id)keep[e.id]=e.value});
 $('#clock').textContent=G.on?fmt(G.h):'';let h;
 const ready=`<div class="hero" style="text-align:center"><h2>Get ready 🎬</h2><div class="muted">The show starts at 3 PM. Keep this page open. Your phone buzzes when something needs you.</div></div>`;
 if(ME.d==='board')h=viewBoard();
 else{const title=ME.d==='client'?'Welcome, '+ME.n.split(' ')[0]:ME.n;h=`<h1>${esc(title)}</h1><div class="muted" style="margin-bottom:10px">${esc(ME.d==='client'?'Your home portal':ME.d==='audit'?'Audit · '+DEPT[ME.aud]+' team'+(me==='ghandour'?' · and every escalation before Salah':''):P[me].fin?'Cost · finance & cheques':ROLE[ME.d])}</div>`;
  h+=!G.on?ready:ME.d==='client'?viewClient():ME.d==='audit'?viewAudit():ME.d==='top'?viewSalah():viewTeam()}
 $('#app').innerHTML=h;Object.keys(keep).forEach(k=>{const e=document.getElementById(k);if(e&&keep[k]!=='')e.value=keep[k]});if(fid){const e=document.getElementById(fid);if(e){e.focus();try{const l=e.value.length;e.setSelectionRange(l,l)}catch(x){}}}
 let ks=[];if(ME.d==='client'){const c=ME.c;ks=tlist().filter(t=>t.c===c).map(t=>t.id+'_'+t.cl.length).concat(G.sel[c].map(s=>s.id+s.st)).concat(G.chat[c].filter(m=>m.w!==me).map(m=>'m'+m.id))}
 else if(['audit','top'].includes(ME.d))ks=escItems(me).map(t=>'E'+t.id+lvl(t)+(t.esc?1:0));
 else if(ME.d!=='board')ks=tlist().filter(t=>t.st==='open'&&t.hold===me).map(t=>t.id+'_'+t.hist.length).concat(homesOf(me).filter(c=>needsMe(c)&&chatWaits(c)).map(c=>'c'+c+G.chat[c].length));
 const nw=ks.filter(k=>!seenK.has(k));ks.forEach(k=>seenK.add(k));
 if(nw.length&&loaded){toast(ME.d==='client'?'🔔 Update from your team':['audit','top'].includes(ME.d)?'🔔 Escalation: needs your attention':'🔔 A unit needs your action');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
const seenK=new Set();let loaded=false;
// ================= sync =================
const API=(new URLSearchParams(location.search).get('api'))||window.DEMO_API||'';
let seen=0,busy=false,epoch=null;
async function pull(mineId){if(!API)return;if(busy&&!mineId)return;busy=true;try{const r=await fetch(API+'?op=get&since='+seen,{cache:'no-store'});const j=await r.json();
 if(j.n<seen||(epoch!==null&&j.epoch!==epoch)){epoch=j.epoch;if(seen>0){G=fresh();seen=0;seenK.clear();loaded=false;busy=false;return pull(mineId)}}epoch=j.epoch;
 if(j.items&&j.items.length){let own='';j.items.forEach(x=>{if(x.show!==3&&x.a!=='reset')return;let m;try{m=apply(x)}catch(e){console.warn(e)}if(x.id&&x.id===mineId)own=m||'Done'});seen=j.n;if(own)toast(own);render()}
 if(!loaded){loaded=true;render()}$('#live').textContent='● Live';$('#live').style.color='#7BD69B'}catch(e){$('#live').textContent='● Reconnecting…';$('#live').style.color='#FF9A8A'}busy=false}
async function send(A){A.ts=Date.now();A.p=me;A.show=3;A.id=A.ts+'-'+Math.random().toString(36).slice(2,7);
 if(!API){const m=apply(A);if(m)toast(m);return render()}
 toast('Sending…');
 try{await fetch(API+'?op=add&d='+encodeURIComponent(JSON.stringify(A)),{cache:'no-store'})}catch(e){return toast('Not sent. Check the connection and try again')}
 while(busy)await new Promise(r=>setTimeout(r,100));await pull(A.id)}
const val=id=>{const e=document.getElementById(id);if(!e)return '';const v=e.value.trim();return v};
const clr=id=>{const e=document.getElementById(id);if(e)e.value=''};
document.addEventListener('click',e=>{
 if(e.target.id==='reset'){e.preventDefault();if(window.confirm('Reset the show for everyone?'))send({a:'reset'});return}
 const xr=e.target.closest('[data-x]');if(xr){X[xr.dataset.x]=!X[xr.dataset.x];return render()}
 const op=e.target.closest('[data-open]');if(op){open=op.dataset.open||null;window.scrollTo(0,0);return render()}
 if(e.target.closest('[data-info]')&&!e.target.closest('button')){showInfo=!showInfo;return render()}
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.tab){tab=b.dataset.tab;return render()}
 if(b.dataset.start)return send({a:'start'});
 if(b.dataset.jump)return send({a:'jump',h:+b.dataset.jump});
 if(b.dataset.sug){const e2=document.getElementById('nx');if(e2){e2.value=b.dataset.sug;e2.focus()}return}
 if(b.dataset.new){const x=val('nx');if(!x)return toast('Write your request first ✍️');clr('nx');return send({a:'new',c:ME.c,x})}
 if(b.dataset.msg){const c=b.dataset.msg,x=val('cm_'+c);if(!x)return toast('Write a message first');clr('cm_'+c);return send({a:'msg',c,x})}
 if(b.dataset.voice)return send({a:'msg',c:b.dataset.voice,v:1});
 if(b.dataset.conv){const x=val('cv_'+b.dataset.conv);if(!x)return toast('Give the selection a name first');return send({a:'conv',c:b.dataset.c,m:+b.dataset.conv,x})}
 if(b.dataset.sel){const s=b.dataset.s,x=val('sc_'+s);if(b.dataset.sel==='no'&&!x)return toast('Write your comment first ✍️');return send({a:b.dataset.sel==='ok'?'selok':'selno',c:ME.c,s,x})}
 const a=b.dataset.act;if(!a)return;const i=b.dataset.i;
 if(a==='esc'){const x=val('e_'+i);if(!x)return toast('Write the reason of escalation first');clr('e_'+i);return send({a,i,x})}
 const x=val('x_'+i);
 if(['reply','opts','quote','no'].includes(a)&&!x)return toast(a==='no'?'Write your comment first ✍️':'Write it first ✍️');
 if(a==='back'&&!x&&!b.dataset.dx)return toast('Write your answer first ✍️');
 clr('x_'+i);send({a,i,x,k:b.dataset.k,k2:b.dataset.k2,dx:b.dataset.dx});
});
G=fresh();render();if(API){pull();setInterval(pull,2500)}
</script>
</body>
</html>
